apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o kompose/
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: datadog
  name: datadog
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: datadog
  strategy:
    type: Recreate
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml -o kompose/
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: datadog
    spec:
      containers:
        - env:
            - name: DD_API_KEY
              value: 37ee954802d4cd2c761cb7d0dfd900b5
            - name: DD_APM_ENABLED
              value: "true"
            - name: DD_SITE
              value: us5.datadoghq.com
          image: gcr.io/datadoghq/agent:latest
          name: dd-agent
      restartPolicy: Always
