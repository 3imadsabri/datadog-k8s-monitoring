apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o kompose/
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: calendar-app
  name: calendar-app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: calendar-app
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml -o kompose/
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: calendar-app
    spec:
      containers:
        - image: calendar-app
          name: calendar
          ports:
            - containerPort: 9090
              protocol: TCP
      restartPolicy: Always
