apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    kompose.cmd: kompose convert -f docker-compose.yaml -o kompose/
    kompose.version: 1.34.0 (cbf2835db)
  labels:
    io.kompose.service: notes-app
  name: notes-app
spec:
  replicas: 1
  selector:
    matchLabels:
      io.kompose.service: notes-app
  template:
    metadata:
      annotations:
        kompose.cmd: kompose convert -f docker-compose.yaml -o kompose/
        kompose.version: 1.34.0 (cbf2835db)
      labels:
        io.kompose.service: notes-app
    spec:
      containers:
        - env:
            - name: CALENDAR_HOST
              value: calendar
            - name: DB_HOST
              value: db
            - name: DD_AGENT_HOST
              value: datadog
          image: notes-app
          name: notes
          ports:
            - containerPort: 8080
              protocol: TCP
      restartPolicy: Always
