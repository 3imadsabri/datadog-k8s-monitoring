apiVersion: v1
kind: Secret
metadata:
  name: postgres-credentials
  namespace: liora
type: Opaque
stringData:
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: Datascientest2023   # imposé par notes_app/database/postgres_connection.py
  POSTGRES_DB: testdb
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: liora
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: db
  namespace: liora
  labels:
    app: db
    tags.datadoghq.com/env: exam
    tags.datadoghq.com/service: postgres
    tags.datadoghq.com/version: "16"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: db
  template:
    metadata:
      labels:
        app: db
        tags.datadoghq.com/env: exam
        tags.datadoghq.com/service: postgres
        tags.datadoghq.com/version: "16"
    spec:
      containers:
        - name: postgres
          image: postgres:16
          envFrom:
            - secretRef:
                name: postgres-credentials
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres", "-d", "testdb"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: liora
spec:
  selector:
    app: db
  ports:
    - port: 5432
      targetPort: 5432
